name: Release Please

# Release automation. On every push to main/master, release-please maintains a
# "release PR" that bumps the version + CHANGELOG from Conventional Commits.
# Merging that PR creates the tag + GitHub Release, and — in the same run — the
# verify → binaries/images stages below build and publish the artifacts.
# workflow_dispatch: re-run after editing a merged PR's BEGIN_COMMIT_OVERRIDE, etc.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Everything below runs ONLY when a release was just created (release PR merged).
  verify:
    name: Verify (test + build)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: go test fireproxy/pkg/... fireproxy/agent/... fireproxy/server/...
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  binaries:
    name: Build & attach binaries
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Resolve version
        id: ver
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # component goos goarch pkg
            out="dist/fireproxy-$1-${VERSION}-$2-$3"
            CGO_ENABLED=0 GOOS=$2 GOARCH=$3 go build -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" -o "$out" "$4"
          }
          build agent  linux arm64 fireproxy/agent/cmd/fireproxy-agent
          build agent  linux amd64 fireproxy/agent/cmd/fireproxy-agent
          build server linux amd64 fireproxy/server/cmd/fireproxy-server
          build server linux arm64 fireproxy/server/cmd/fireproxy-server
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  images:
    name: Build & push images
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve version
        id: ver
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          v="${tag#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
