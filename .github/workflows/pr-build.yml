name: PR Build

# Compiles artifacts for every PR to main/master. Preview images are pushed to
# GHCR ONLY for pull requests opened from a branch in this repository (i.e. by
# maintainers) — never for PRs from forks (untrusted), which get a read-only
# token and no package-write access.
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: Build binaries (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Version label
        id: ver
        run: echo "version=pr${{ github.event.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # component goos goarch pkg
            out="dist/fireproxy-$1-${VERSION}-$2-$3"
            CGO_ENABLED=0 GOOS=$2 GOARCH=$3 go build -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" -o "$out" "$4"
          }
          build agent  linux arm64 fireproxy/agent/cmd/fireproxy-agent
          build server linux amd64 fireproxy/server/cmd/fireproxy-server
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.number }}-binaries
          path: dist/*
          retention-days: 7

  images:
    name: Push preview images (maintainers only)
    # Gate: only same-repo PRs (maintainer branches), not forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push preview
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.component }}:pr-${{ github.event.number }}
          build-args: |
            VERSION=pr${{ github.event.number }}
