name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent
        - Server
        - UI
        - Modules (UniFi / TP-Link)
        - Packaging / CI
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
