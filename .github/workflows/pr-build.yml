name: PR Build

# Compiles binary artifacts for every PR to main/master. Images are published
# only by release workflows — not from pull requests (avoids GHCR storage growth).
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: Build binaries (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Version label
        id: ver
        run: echo "version=pr${{ github.event.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # component goos goarch pkg
            out="dist/fireproxy-$1-${VERSION}-$2-$3"
            CGO_ENABLED=0 GOOS=$2 GOARCH=$3 go build -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" -o "$out" "$4"
          }
          build agent  linux arm64 fireproxy/agent/cmd/fireproxy-agent
          build server linux amd64 fireproxy/server/cmd/fireproxy-server
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.number }}-binaries
          path: dist/*
          retention-days: 7
