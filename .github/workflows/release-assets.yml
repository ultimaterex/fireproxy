name: Release assets

# Manual backfill / republish of GitHub Release binaries (and optionally GHCR
# images) for an existing tag. Use when release-please created the tag/Release
# but the binaries/images jobs did not run (or need a rebuild).
#
# Does not move floating image tags (:latest / :0.1) — only the exact version
# tag — so republishing an older release cannot roll back current pointers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to attach assets to (e.g. v0.1.1)"
        required: true
        type: string
      publish_images:
        description: "Also rebuild and push multi-arch GHCR images for this version tag only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build & attach binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require existing tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # component goos goarch pkg
            out="dist/fireproxy-$1-${VERSION}-$2-$3"
            CGO_ENABLED=0 GOOS=$2 GOARCH=$3 go build -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" -o "$out" "$4"
          }
          build agent  linux arm64 fireproxy/agent/cmd/fireproxy-agent
          build agent  linux amd64 fireproxy/agent/cmd/fireproxy-agent
          build server linux amd64 fireproxy/server/cmd/fireproxy-server
          build server linux arm64 fireproxy/server/cmd/fireproxy-server
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          overwrite_files: true
          make_latest: false

  images:
    name: Build & push images
    if: ${{ inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, ui]
    steps:
      - name: Require existing tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
