# Coverage is informational — it never blocks a PR.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, files"
  require_changes: true

# Only Go coverage is uploaded; skip non-Go and low-signal paths.
ignore:
  - "ui/**"
  - "**/*_test.go"
  - "**/testdata/**"
  - "server/cmd/**"
  - "agent/cmd/**"
